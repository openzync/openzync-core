# Onboarding defaults for new organizations.
#
# Returned by GET /admin/org/config/defaults.  The onboarding page
# pre-fills its config form with these values so the user only needs
# to fill in secrets (API keys) and tweak any preferences before saving.
#
# These defaults are NOT fallbacks — they are UI seed values.  The
# backend code never reads this file at runtime to resolve a missing
# config value.  If a required field is absent from the stored per-org
# config, the backend raises an explicit error.

llm_backend: openai

# Secrets — left blank so the user MUST fill them in during onboarding.
openai_api_key: ""

llm_model: gpt-4o-mini
llm_temperature: 0.0
llm_max_tokens: 4096

# Embeddings: no onboarding defaults. They are produced by a single local
# ONNX model (core/embeddings.py) with nothing to configure — do NOT
# reintroduce an embedding_* key here. This endpoint is unauthenticated,
# so anything added is served to anonymous callers.

graph_backend: falkordb
graph_search_type: hybrid
graph_max_traversal_depth: 2

context_cache_ttl: 300
audit_log_response_body: false

# Per-episode enrichment toggles — all-ON by default. Unset keys resolve
# to true at ingest (system < org < per-request); see core/enrichment_config.
enrichment:
  entities: true
  embedding: true
  facts: true
  entity_links: true
  classification: true
  structured: true
  observations: true
  blob_text: true
  llm_invalidation: true

# Re-ranker (RET-05) — both backends disabled by default
# Set reranker_backend to "sentence_transformers" or "cohere" to enable
reranker_backend: null
reranker_model: ""
reranker_top_k: 50
reranker_top_n: 10
cohere_api_key: ""
