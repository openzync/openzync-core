# ──────────────────────────────────────────────────────────────────────────────
# OpenZync — GitLab CI pipeline
# ──────────────────────────────────────────────────────────────────────────────
# Stages:
#   lint            → ruff, mypy
#   test-unit       → pytest with coverage
#   test-integration → pytest with real Postgres/Redis via CI services
#   build           → Docker image (main/tags only)
#
# Credentials: All database passwords use GitLab CI/CD masked variables.
#   $CI_DB_PASSWORD  — set in CI/CD Settings → CI/CD → Variables (masked).
#                      Defaults to 'falkordb' for ephemeral CI containers only.
#   NEVER hardcode credentials in this file.
# ──────────────────────────────────────────────────────────────────────────────

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  COLUMNS: "120"
  # CI database — ephemeral service container, destroyed after pipeline run.
  # Override via CI/CD Settings → Variables → CI_DB_PASSWORD (masked)
  CI_DB_PASSWORD: "${CI_DB_PASSWORD:-postgres}"
  # JWT signing key for CI — override via CI/CD Settings → Variables → CI_SECRET_KEY (masked)
  CI_SECRET_KEY: "${CI_SECRET_KEY:-ci-secret-key-that-is-at-least-32-chars!!}"

stages:
  - lint
  - test-unit
  - test-integration
  - build
  - docs

default:
  image: python:3.12-slim
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip/
      - .venv/

# ═══════════════════════════════════════════════════════════════════════════════
# LINT
# ═══════════════════════════════════════════════════════════════════════════════

ruff:
  stage: lint
  script:
    - pip install ruff
    - ruff check . --output-format=gitlab
    - ruff format --check .
  allow_failure: false

mypy:
  stage: lint
  script:
    - pip install mypy
    - pip install -e ".[dev]"
    - mypy core/ middleware/ dependencies/ routers/ models/ schemas/ services/
  allow_failure: true

changelog-check:
  stage: lint
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS =~ /trivial|skip-changelog/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - pip install towncrier>=24
    - |
      BASE=$(git remote show origin 2>/dev/null | sed -n 's/.*HEAD branch: //p')
      if [ -z "$BASE" ]; then BASE=main; fi
      if git rev-parse --verify origin/$BASE >/dev/null 2>&1; then REF=origin/$BASE
      elif git rev-parse --verify origin/main >/dev/null 2>&1; then REF=origin/main
      else REF=origin/master; fi
      echo "Checking fragments against $REF..."
      git fetch origin $BASE 2>/dev/null || git fetch origin main 2>/dev/null || git fetch origin master 2>/dev/null || true
      towncrier check --compare-with $REF --config pyproject.toml

changelog-build:
  stage: build
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - pip install towncrier>=24
    - |
      VERSION=${CI_COMMIT_TAG#v}
      echo "Building changelog for $VERSION (tag $CI_COMMIT_TAG)..."
      towncrier build --version "$VERSION" --yes --config pyproject.toml || echo "No fragments to build for $VERSION"
    - git config user.email "ci@openzync.tech"
    - git config user.name "CI"
    - git add CHANGELOG.md changelog.d
    - git diff --cached --quiet || git commit -m "chore(changelog): release ${CI_COMMIT_TAG#v} [skip ci]"
    - |
      DEFAULT_BRANCH=$(git remote show origin 2>/dev/null | sed -n 's/.*HEAD branch: //p')
      if [ -z "$DEFAULT_BRANCH" ]; then DEFAULT_BRANCH=main; fi
      if ! git rev-parse --verify origin/$DEFAULT_BRANCH >/dev/null 2>&1; then
        if git rev-parse --verify origin/main >/dev/null 2>&1; then DEFAULT_BRANCH=main
        else DEFAULT_BRANCH=master; fi
      fi
      echo "Pushing changelog to $DEFAULT_BRANCH..."
      git push "https://oauth2:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:$DEFAULT_BRANCH || echo "WARNING: git push failed"

# ═══════════════════════════════════════════════════════════════════════════════
# UNIT TESTS
# ═══════════════════════════════════════════════════════════════════════════════

test-unit:
  stage: test-unit
  script:
    - pip install -e ".[dev]"
    - pytest tests/unit/ -v --timeout=30 -n auto
      --cov=core --cov=routers --cov=services --cov=repositories
      --cov=middleware --cov=dependencies --cov=workers --cov=packages
      --cov=schemas --cov=utils
      --cov-report=term --cov-report=xml:coverage.xml
      --cov-fail-under=75
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: gocover
        path: coverage.xml

# ═══════════════════════════════════════════════════════════════════════════════
# INTEGRATION TESTS  (requires Postgres + Redis)
# ═══════════════════════════════════════════════════════════════════════════════
# Service containers are ephemeral — created per job and destroyed after.
# The password 'postgres' is the default for the official postgres:15 image.

test-integration:
  stage: test-integration
  services:
    - name: postgres:15
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_PASSWORD: "$CI_DB_PASSWORD"
    POSTGRES_USER: postgres
    POSTGRES_DB: test
    OZ_DATABASE_URL: "postgresql+asyncpg://postgres:${CI_DB_PASSWORD}@postgres:5432/test"
    OZ_REDIS_URL: "redis://redis:6379/0"
    OZ_FALKORDB_URL: "redis://redis:6379/0"
    OZ_SECRET_KEY: "$CI_SECRET_KEY"
    OZ_ENVIRONMENT: "testing"
    OZ_LOG_LEVEL: "WARNING"
  before_script:
    - apt-get update -qq && apt-get install -y -qq postgresql-client >/dev/null 2>&1
    - PGPASSWORD="$CI_DB_PASSWORD" psql -h postgres -U postgres -c "CREATE DATABASE test;" 2>/dev/null || true
    - pip install -e ".[dev]"
  script:
    - alembic upgrade head
    - pytest tests/integration/ -v --timeout=60
      --cov=core --cov=routers --cov=services --cov=repositories
      --cov=middleware --cov=dependencies --cov=workers --cov=packages
      --cov=schemas --cov=utils
      --cov-report=term --cov-report=xml:coverage.xml
      --cov-fail-under=74
  needs: ["test-unit"]

# ═══════════════════════════════════════════════════════════════════════════════
# BUILD  (Docker image — main branch and tags only)
# ═══════════════════════════════════════════════════════════════════════════════

build-api:
  stage: build
  image: docker:24
  services:
    - docker:dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t openzync-api:${CI_COMMIT_SHORT_SHA:-latest} -f services/api/Dockerfile .
    - docker tag openzync-api:${CI_COMMIT_SHORT_SHA} openzync-api:latest
  needs: ["test-integration"]
  only:
    - main
    - tags
  except:
    - schedules

# ═══════════════════════════════════════════════════════════════════════════════
# SECURITY SCAN  (weekly schedule)
# ═══════════════════════════════════════════════════════════════════════════════

dependency-scan:
  stage: test-unit
  script:
    - pip install pip-audit
    - pip-audit
  only:
    - schedules

# ═══════════════════════════════════════════════════════════════════════════════
# DOCUMENTATION  (validate that Sphinx builds cleanly)
# ═══════════════════════════════════════════════════════════════════════════════
# Builds the Sphinx HTML docs and treats any warning as a build failure.
# Publishing is handled by ReadTheDocs (configured in .readthedocs.yaml).

docs:
  stage: docs
  script:
    - pip install -e ".[doc]"
    - sphinx-apidoc -o docs/api/ core/ routers/ models/ schemas/ services/
        repositories/ middleware/ dependencies/ workers/ utils/ packages/
        --force --module-first
    - sphinx-build -b html docs/ docs/_build/html
  only:
    - main
  except:
    - schedules
