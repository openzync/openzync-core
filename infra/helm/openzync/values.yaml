# ──────────────────────────────────────────────────────────────────────────────
# OpenZync Helm chart — values.yaml
# ──────────────────────────────────────────────────────────────────────────────
# All configurable parameters for the OpenZync deployment.
# Override via `--set key=value` or a custom values file.
# ──────────────────────────────────────────────────────────────────────────────

# ── Global settings ───────────────────────────────────────────────────────────
global:
  environment: production
  logLevel: INFO
  imageRegistry: ghcr.io/openzync # GHCR images are public — no pull auth needed since 2026-08-31

# ── API service ───────────────────────────────────────────────────────────────
api:
  name: openzync-api
  replicaCount: 2
  image:
    repository: openzync-api
    # ⚠️ pin in production, e.g. tag: "v1.2.3" (or "v1.2.3@sha256:<digest>"
    # for a digest pin). :latest floats — a re-pull can move it under you.
    tag: "1.0.0"   # release version — keep in lockstep with Chart appVersion. Never :latest.
    pullPolicy: IfNotPresent
  containerPort: 8000
  health:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
  resources:
    limits:
      cpu: "2"
      memory: "4Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  # ── DB connection budget ───────────────────────────────────────────────
  # Every API replica and every worker replica opens up to
  #   pool_size + max_overflow
  # Postgres connections.  The budget must satisfy:
  #
  #   replicas x (pool_size + max_overflow) < max_connections
  #
  # With api.maxReplicas=10, worker.maxReplicas=5 and the pool defaults
  # below (4 + 1):  15 x 5 = 75 connections — inside the Postgres default
  # of 100.  Raising the pool size or the replica counts means raising
  # max_connections on the database first (e.g. to 200), or the database
  # runs out of connections and requests queue.
  ingress:
    enabled: false
    host: api.openzync.tech
    tls:
      enabled: true
      secretName: openzync-tls

# ── Worker service ────────────────────────────────────────────────────────────
worker:
  name: openzync-worker
  replicaCount: 1
  image:
    repository: openzync-worker
    # ⚠️ pin in production, e.g. tag: "v1.2.3" (or "v1.2.3@sha256:<digest>"
    # for a digest pin). Keep in lockstep with api.image.tag.
    tag: "1.0.0"   # release version — keep in lockstep with api.image.tag. Never :latest.
    pullPolicy: IfNotPresent
  health:
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 5
  resources:
    limits:
      cpu: "2"
      memory: "4Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75

# ── PostgreSQL ────────────────────────────────────────────────────────────────
postgresql:
  enabled: true
  image: pgvector/pgvector:pg15
  port: 5432
  database: openzync
  user: openzync
  existingSecret: ""
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  resources:
    limits:
      cpu: "2"
      memory: "4Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"

# ── Redis ─────────────────────────────────────────────────────────────────────
redis:
  enabled: true
  image: redis:7-alpine
  port: 6379
  existingSecret: ""
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  resources:
    limits:
      cpu: "1"
      memory: "1Gi"
    requests:
      cpu: "200m"
      memory: "512Mi"

# ── Application configuration ─────────────────────────────────────────────────
config:
  # LLM backend
  llmBackend: "ollama"
  llmModel: "llama3.2:3b"
  ollamaBaseUrl: "http://ollama:11434"
  # Shared Ollama embedder (compose default stack). Same host/port as
  # ollamaBaseUrl — separate key so embeds survive LLM provider changes.
  # No Ollama container in this chart by decision (external/shared service).
  ollamaEmbedUrl: "http://ollama:11434"

  # Graph backend
  graphBackend: "falkordb"
  graphMaxTraversalDepth: 2

  # Context
  contextCacheTtl: 30

  # JWT
  jwtAccessTokenTtlMinutes: 30
  jwtRefreshTokenTtlDays: 7

  # Rate limiting
  rateLimitIpMax: 100
  rateLimitWindowSec: 60

  # ── DB connection pool ──────────────────────────────────────────────────
  # See the budget note next to api.autoscaling above:
  #   replicas x (dbPoolSize + dbMaxOverflow) < max_connections
  dbPoolSize: 4
  dbMaxOverflow: 1

  # ── Reverse proxy ───────────────────────────────────────────────────────
  # Peers allowed to set X-Forwarded-For (uvicorn --forwarded-allow-ips).
  # Must cover the ingress/reverse-proxy tier that fronts the api, otherwise
  # every request is attributed to the proxy and the per-IP rate limiters
  # become platform-wide buckets.  Narrow this to the ingress controller's
  # pod or node CIDR.  Never "*" — a client could then forge its own IP.
  # 10.244.0.0/16 is the kubeadm/kind default pod CIDR.
  trustedProxyIps: "10.244.0.0/16"

  # CORS
  corsOrigins: "http://localhost:3000"

  # Observability
  otlpEndpoint: "http://alloy:4317"

# ── Secrets (reference external or use --set) ─────────────────────────────────
secrets:
  # Set via --set or external-secrets operator
  databaseUrl: ""
  redisUrl: ""
  falkordbUrl: ""
  secretKey: ""
  openaiApiKey: ""
  anthropicApiKey: ""

# ── Service accounts ──────────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: ""
  annotations: {}
