apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openzync.fullname" . }}-worker
  labels:
    {{- include "openzync.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "openzync.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "openzync.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          ports:
            - name: health
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: {{ include "openzync.fullname" . }}-config
            - secretRef:
                name: {{ include "openzync.fullname" . }}-secrets
                optional: true
          # Worker serves /health on HEALTH_PORT (default 8081 — see
          # services/worker/worker_settings.py, worker.py health server).
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: {{ .Values.worker.health.initialDelaySeconds }}
            periodSeconds: {{ .Values.worker.health.periodSeconds }}
            timeoutSeconds: {{ .Values.worker.health.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
