# ──────────────────────────────────────────────────────────────────────────────
# Prometheus configuration — OpenZync dev mode
# ──────────────────────────────────────────────────────────────────────────────
# Scrapes the api service's /metrics endpoint over the compose network.
# For host-run API dev (uvicorn on the laptop, Prometheus in compose),
# override the target to host.docker.internal:8000 instead.
# In production, replace with the Kubernetes service discovery.
# ──────────────────────────────────────────────────────────────────────────────

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: "openzync-api"
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          job: "openzync-api"
