# ------------------------------------------------------------------------------
# OpenZync - Backend Stack (plain-.env config, no secrets manager)
# ------------------------------------------------------------------------------
# Self-contained: no external networks, no pre-created resources.
# `docker compose --env-file .env -f infra/docker-compose.backend.yml up -d`
# brings the entire stack from a cold start to a working api + worker, with
# every setting read from the host .env file (env_file on each service) plus
# the direct OZ_* entries below.
#
# Service graph (default - falkordb always on; no local database, Supabase/CloudSQL):
#
#   postgres-init -→ postgres-migrate
#        |                |
#        +------→ redis ←-+
#                 |    |
#                 v    v
#                api  worker
#
#   With --profile local-db:
#
#   postgres -→ postgres-init -→ postgres-migrate
#
# Default stack always includes falkordb (graph is falkordb by default).
# SurrealDB stays optional under --profile alt-graph.
#
# One-shot services (exit 0, restart: no) sit on the critical path. Restart-
# loop services (postgres, api, worker, redis) come up last and stay up.
#
# Config model:
#   - Every service takes env_file: ../.env (repo-root .env, the same file
#     `make dev` sources), so compose runs and host runs share one source
#     of truth - no sidecars, no rendered-secret volumes, no bootstrap
#     artefacts.
#   - First boot with --profile local-db: postgres-init creates the
#     openzync database + migrator/app roles (passwords from
#     POSTGRES_MIGRATOR_PASSWORD / POSTGRES_APP_PASSWORD when set,
#     auto-generated otherwise - the script prints an export snippet to
#     copy into .env), then postgres-migrate applies Alembic using
#     DATABASE_URL / OZ_DATABASE_URL from the environment.
#
# Profiles:
#   --profile observability  (Prometheus + Grafana + Alloy)
#   --profile local-db       (Postgres + init + migrate)
#   --profile alt-graph      (SurrealDB - optional extra graph backend;
#                             FalkorDB is now part of the default stack)
# Ollama is DEFAULT (not a profile): one shared container replaces 2x
# in-process ONNX embedders (~700-785MB/process OOM on the 1.9GB VPS).
#
# Required env vars (no defaults - compose will refuse to start if absent):
#   OZ_SECRET_KEY            app SECRET_KEY (JWT signing; 48+ char url-safe)
#   OZ_WEBHOOK_SIGNING_SECRET app webhook signing secret (32+ char url-safe)
#   OZ_DATABASE_URL          asyncpg URL for api/worker/migrate
#                            (e.g. postgresql+asyncpg://user:pass@postgres:5432/openzync)
#
# Required with --profile local-db (only):
#   POSTGRES_PASSWORD        superuser password for first-boot cluster init
#
# Optional env vars (defaults shown):
#   OZ_ENVIRONMENT=development
#   OZ_CORS_ORIGINS=http://localhost:3000
#   OZ_LOG_LEVEL=INFO
#   OZ_MAX_WORKERS=4
#   OZ_JWT_ACCESS_TOKEN_TTL_MINUTES=30
#   OZ_JWT_REFRESH_TOKEN_TTL_DAYS=7
#   OZ_PROMETHEUS_URL=http://prometheus:9090
#   OZ_REDIS_URL=redis://redis:6379/0
#   OZ_FALKORDB_URL=redis://falkordb:6379  (required - FalkorDB is default graph)
#   OZ_FALKORDB_MAX_CONNECTIONS=10  (budget: 15 max Helm replicas x 10 = 150
#   worst-case - the pool stays small instead of relying on the server default)
#   OZ_FALKORDB_SOCKET_TIMEOUT=30
#   OZ_SURREALDB_URL=          (empty default; the gate stays off while unset)
#   OZ_RATE_LIMIT_IP_MAX=10
#   OZ_RATE_LIMIT_WINDOW_SEC=60
#   OZ_DB_POOL_SIZE=4
#   OZ_DB_MAX_OVERFLOW=1
#   OZ_TRUSTED_PROXY_IPS=172.28.0.0/24  (the compose network subnet)
#
# SurrealDB still needs --profile alt-graph:
#   OZ_SURREALDB_URL=ws://surrealdb:8000/rpc \
#     docker compose --profile alt-graph up -d
# FalkorDB is always on - no profile needed.
# ------------------------------------------------------------------------------

# ── Logging defaults ─────────────────────────────────────────────────────────
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── 1. Postgres (database) ────────────────────────────────────────────────
  # pgvector image ships the vector extension types required by the
  # embeddings schema. POSTGRES_PASSWORD must be set on FIRST boot;
  # subsequent restarts use the password stored in postgres-data.
  postgres:
    profiles: [local-db]
    image: pgvector/pg15-py
    container_name: openzync-postgres
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-}"
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  # ── 2. Postgres init (one-shot — create DB + users) ──────────────────────
  # Creates the openzync database and two roles:
  #   openzync_migrator  DDL (used by alembic upgrade head)
  #   openzync_app       CRUD (used by api + worker at runtime)
  # Role passwords come from POSTGRES_MIGRATOR_PASSWORD /
  # POSTGRES_APP_PASSWORD when set, otherwise the script auto-generates
  # them and prints an export snippet to copy into .env.
  # If POSTGRES_SUPERUSER_PASSWORD matches the env-provided POSTGRES_PASSWORD,
  # the superuser is left untouched (so subsequent restarts still work).
  postgres-init:
    profiles: [local-db]
    image: pgvector/pg15-py
    container_name: openzync-postgres-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DB_NAME: openzync
      # POSTGRES_SUPERUSER_PASSWORD is optional. If set, the script uses it
      # and does NOT rotate the superuser. If unset, the script auto-generates
      # one and rotates the superuser.
      # We pass POSTGRES_PASSWORD so the superuser password matches what
      # the postgres container used for first-boot cluster init.
      POSTGRES_SUPERUSER_PASSWORD: "${POSTGRES_PASSWORD:-}"
      POSTGRES_MIGRATOR_PASSWORD: "${POSTGRES_MIGRATOR_PASSWORD:-}"
      POSTGRES_APP_PASSWORD: "${POSTGRES_APP_PASSWORD:-}"
    volumes:
      - ../scripts/init_postgres.sh:/init_postgres.sh:ro,z
    entrypoint: ["/bin/sh", "-c", "if ! command -v python3 >/dev/null 2>&1; then apt-get update -qq && apt-get install -y -qq python3; fi; exec /bin/bash /init_postgres.sh"]
    logging: *default-logging
    restart: "no"

  # ── 3. Postgres migrate (one-shot — alembic upgrade head) ────────────────
  # Reads DATABASE_URL / OZ_DATABASE_URL straight from the environment
  # (repo-root .env via env_file) — entrypoint_migrate.sh fail-fasts when
  # neither is set. Use the migrator URL here (openzync_migrator, DDL).
  postgres-migrate:
    profiles: [local-db]
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    image: openzync-api:latest
    container_name: openzync-postgres-migrate
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    env_file:
      - path: ../.env
        required: true
    environment:
      OZ_ENVIRONMENT: development   # suppress any prod-only startup checks
    volumes:
      - ../scripts/entrypoint_migrate.sh:/entrypoint_migrate.sh:ro,z
    entrypoint: ["/bin/bash", "/entrypoint_migrate.sh"]
    command: ["alembic", "upgrade", "head"]
    logging: *default-logging
    restart: "no"

  # ── 4. API service ─────────────────────────────────────────────────────
  # Plain-.env config: repo-root .env via env_file plus the direct OZ_*
  # entries below. The entrypoint (/entrypoint_api.sh, baked into the image)
  # fail-fasts when OZ_DATABASE_URL / OZ_SECRET_KEY are unset, then execs
  # uvicorn so it becomes PID 1 and receives SIGTERM directly.
  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    # public on ghcr.io — docker pull needs no auth since 2026-08-31
    image: ghcr.io/openzync/openzync-core/api:latest
    container_name: openzync-api
    env_file:
      - path: ../.env
        required: true
    environment:
      UVICORN_WORKERS: "1"
      # Peers allowed to set X-Forwarded-For — uvicorn's
      # --forwarded-allow-ips.  Must cover the reverse proxy (nginx) that
      # fronts the api on the compose network; the subnet is pinned in the
      # `networks` block below so the trusted range is explicit rather
      # than whatever the default bridge happens to be.  Never "*": a
      # client could then forge its own IP and bypass the per-IP limiters.
      OZ_TRUSTED_PROXY_IPS: "${OZ_TRUSTED_PROXY_IPS:-172.28.0.0/24}"
      # Graph-backend URLs (alt-graph profile). Container env wins over
      # the .env file values above.
      OZ_SURREALDB_URL: "${OZ_SURREALDB_URL:-}"
      OZ_FALKORDB_URL: "${OZ_FALKORDB_URL:-}"
    depends_on:
      redis:
        condition: service_healthy
      # Aux deps start-order only — FalkorDB/Ollama outages degrade the
      # API (see lifespan degraded flag + /ready), never block boot.
      falkordb:
        condition: service_started
      ollama:
        condition: service_started
    ports: ["127.0.0.1:8000:8000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits: { cpus: "1", memory: "2G" }
        reservations: { cpus: "0.5", memory: "1G" }
    logging: *default-logging
    restart: unless-stopped

  # ── 5. Worker service ──────────────────────────────────────────────────
  # ARQ worker. Plain-.env config like the api: entrypoint_worker.sh
  # fail-fasts when OZ_DATABASE_URL / OZ_SECRET_KEY are unset, then execs
  # the worker loop as PID 1.
  worker:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    # public on ghcr.io — docker pull needs no auth since 2026-08-31
    image: ghcr.io/openzync/openzync-core/worker:latest
    container_name: openzync-worker
    env_file:
      - path: ../.env
        required: true
    environment:
      OZ_SURREALDB_URL: "${OZ_SURREALDB_URL:-}"
      OZ_FALKORDB_URL: "${OZ_FALKORDB_URL:-}"
    depends_on:
      redis:
        condition: service_healthy
      # Aux deps start-order only — FalkorDB/Ollama outages degrade the
      # worker (tasks fail loud + retry), never block boot.
      falkordb:
        condition: service_started
      ollama:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits: { cpus: "1", memory: "2G" }
    logging: *default-logging
    restart: unless-stopped

  # ── Redis (caching, queues, pub/sub) ─────────────────────────────────────
  # api + worker depend on this with service_healthy so the redis-cli PING
  # must pass before the app containers can start.
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6380:6379"]
    # Cap cache memory to free ~200MB headroom on the 1.9GB VPS. noeviction
    # (not allkeys-lru): DB 0 is shared between cache keys AND ARQ job +
    # dedup keys, so LRU eviction would silently drop queued/dedup state.
    # Capped writes fail loudly instead; size cache keys with TTLs.
    # ⚠️ noeviction risk: when maxmemory is hit, EVERY write (including
    # ARQ enqueues) errors until keys expire — watch `redis_memory_used`
    # and the OpenZyncQueueBacklog alert, and grow maxmemory before
    # raising result TTLs or dropping key TTLs.  A memory-usage alert
    # (e.g. used_memory > 100MB sustained) belongs next to the queue
    # alerts in infra/prometheus/alerts.yml.
    # Persistence: redis-data still holds RDB snapshots in /data; appendonly
    # coexists with RDB (no conflict), so AOF is on for job durability.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  # ── MinIO (S3-compatible object storage) — OPTIONAL ─────────────────────────
  # Required for blob/file attachment support.  Without this service, blob
  # upload endpoints will fail when the org config points here.
  # Uses the local-db profile (same as Postgres) since it's a dev dependency.
  minio:
    profiles: [local-db]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: openzync-minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
    volumes:
      - minio-blob-data:/data
    # mc ready won't work — mc isn't in the minio image. Use the live endpoint.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  # ── MinIO init (one-shot — create bucket + versioning + lifecycle) ─────────
  minio-init:
    profiles: [local-db]
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: openzync-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        sleep 3
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}

        # Create bucket (idempotent)
        mc mb --ignore-existing local/openzync-blobs

        # Enable bucket versioning — protects against accidental overwrites
        # and provides a recovery window for deleted objects.
        mc version enable local/openzync-blobs

        # Set lifecycle policy:
        #   - Expire objects after 90 days (safety net for orphaned blobs)
        #   - Abort incomplete multipart uploads after 1 day
        #   - Remove non-current versions after 30 days
        mc ilm import local/openzync-blobs <<EOF
        {
          "Rules": [
            {
              "ID": "auto-cleanup",
              "Status": "Enabled",
              "Expiration": { "Days": 90 }
            },
            {
              "ID": "abort-incomplete-uploads",
              "Status": "Enabled",
              "AbortIncompleteMultipartUpload": { "DaysAfterInitiation": 1 }
            },
            {
              "ID": "noncurrent-version-cleanup",
              "Status": "Enabled",
              "NoncurrentVersionExpiration": { "NoncurrentDays": 30 }
            }
          ]
        }
        EOF

        echo "MinIO bucket 'openzync-blobs' ready with versioning and lifecycle."
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
    logging: *default-logging
    restart: "no"

  # ── Ollama (shared embedding inference) — DEFAULT ─────────────────────
  # One container (~100MB idle, ~300MB with nomic-embed-text:v1.5 loaded)
  # replaces 2x in-process ONNX embedders that OOM-killed the 1.9GB VPS.
  # api + worker reach it at http://ollama:11434 (compose DNS).
  ollama:
    # Tag-pinned (was :latest for reproducibility). Digest pin lives here —
    # resolve via `docker buildx imagetools inspect ollama/ollama:<tag>`
    # and append @sha256:<digest> when CI next touches this line.
    image: ollama/ollama:0.11.2
    container_name: openzync-ollama
    ports: ["127.0.0.1:11434:11434"]
    environment:
      OLLAMA_KEEP_ALIVE: "24h"   # keep nomic-embed-text resident, skip reloads
      OLLAMA_HOST: "0.0.0.0:11434"
    volumes:
      # Persist pulled models across restarts — 274MB pull happens once.
      - ollama-data:/root/.ollama
    healthcheck:
      # curl preferred; `ollama ps` fallback (image may lack curl in future tags).
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags >/dev/null 2>&1 || ollama ps >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12   # ~2min — covers cold start + model load
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1", memory: "512M" }
        reservations: { cpus: "0.25", memory: "350M" }
    logging: *default-logging
    restart: unless-stopped

  # ── Prometheus (metrics storage) — OPTIONAL ──────────────────────────────
  # extra_hosts lets the scrape config reach the api at host.docker.internal
  # (compose v2+ maps this to the host gateway on macOS/Windows and the
  # host's bridge on Linux). For Linux on a custom network, switch the
  # scrape target to `api:8000` instead.
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.53.0
    ports: ["9090:9090"]
    volumes:
      - ./prometheus:/etc/prometheus:ro,z
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging: *default-logging
    restart: unless-stopped

  # ── Grafana (visualisation dashboards) — OPTIONAL ────────────────────────
  grafana:
    profiles: [observability]
    image: grafana/grafana:11.0.0
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"        # read-only — was Admin before audit
      GF_SECURITY_ADMIN_PASSWORD: "${GF_ADMIN_PASSWORD:?GF_ADMIN_PASSWORD is required}"
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro,z
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro,z
    logging: *default-logging
    restart: unless-stopped

  # ── Grafana Alloy (OpenTelemetry collector) — OPTIONAL ───────────────────
  alloy:
    profiles: [observability]
    image: grafana/alloy:v1.7.5
    ports:
      - "4317:4317"
      - "12345:12345"
    volumes:
      - ./alloy:/etc/alloy:ro,z
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    logging: *default-logging
    restart: unless-stopped

  # ── SurrealDB (graph backend — record/memory model) — OPTIONAL ──────────────
  # Activate with --profile alt-graph. Wire the app to it via
  #   OZ_SURREALDB_URL=ws://surrealdb:8000/rpc
  # Host port 8001 — 8000 on the host is the api's publish port.
  # In-memory storage (per task spec); for persistence use
  # `start file://data` (v2) / `surrealkv://data` (v3) + a named volume.
  surrealdb:
    profiles: [alt-graph]
    image: surrealdb/surrealdb:v3.2.3
    container_name: openzync-surrealdb
    command: start --log trace --user ${SURREALDB_USER:-root} --pass ${SURREALDB_PASS:-root}
    ports: ["127.0.0.1:8001:8000"]
    healthcheck:
      test: ["CMD", "surreal", "is-ready", "--conn", "http://localhost:8000"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  # ── FalkorDB (graph backend — property-graph over RESP) — DEFAULT ──────────
  # Always on — default graph backend is falkordb.
  # Wire the app via OZ_FALKORDB_URL=redis://falkordb:6379 (from .env).
  # Host port 6381 — redis owns host 6380 (falkordb was 6380 under alt-graph,
  # moved to 6381 when promoted to default to avoid host-port collision).
  falkordb:
    image: falkordb/falkordb:v4.20.1-alpine
    container_name: openzync-falkordb
    ports: ["127.0.0.1:6381:6379"]
    environment:
      # No --maxclients override: the server default (Redis-family 10000)
      # dwarfs the app-side budget (15 max Helm replicas x pool 10 = 150),
      # so the pool — not the server — is the binding constraint.
      REDIS_ARGS: "--appendonly yes"
    volumes:
      - falkordb-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

# ── Named volumes ────────────────────────────────────────────────────────────
# postgres-data:       Postgres data directory
# Secrets are NOT stored in volumes: every service reads the repo-root .env
# (env_file) directly. For production, inject the same keys via your
# orchestrator's secret store (e.g. Kubernetes Secrets / external-secrets)
# instead of committing .env anywhere.
networks:
  default:
    name: openzync_network
    external: true # attach-only: compose never creates/removes this network; subnet 172.28.0.0/24 is pinned at creation time by the CD preflight `docker network create --subnet 172.28.0.0/24`.

volumes:
  minio-blob-data: {}
  redis-data: {}
  ollama-data: {}
  grafana-data: {}
  prometheus-data: {}
  postgres-data: {}
  falkordb-data: {}
