# ──────────────────────────────────────────────────────────────────────────────
# OpenZync — GitHub Actions CI pipeline (PR-only)
# ──────────────────────────────────────────────────────────────────────────────
# Stages:
#   lint            → ruff, mypy (diff-scoped on changed .py files)
#   test-unit       → pytest with coverage
#   test-integration → combined unit + integration coverage (Postgres + Redis + FalkorDB)
# Tag builds/deploys live in cd.yml.
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip test jobs and deploy directly"
        type: boolean
        default: false

# Grant write permission to ghcr.io for the build job.
# The GITHUB_TOKEN defaults to read-only for packages — this elevates it.
permissions:
  contents: read
  packages: write
  id-token: write

env:
  PYTHON_VERSION: "3.12"
  OZ_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
  OZ_REDIS_URL: "redis://localhost:6379/0"
  OZ_FALKORDB_URL: "redis://localhost:6380"
  OZ_SECRET_KEY: "ci-secret-key-that-is-at-least-32-chars!!"
  OZ_ENVIRONMENT: "testing"
  OZ_LOG_LEVEL: "WARNING"

jobs:
  # ═════════════════════════════════════════════════════════════════════════════
  # LINT
  # ═════════════════════════════════════════════════════════════════════════════
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          base: origin/master
          list-files: shell
          filters: |
            py_changed:
              - '**/*.py'
      - run: pip install ruff mypy
      - if: steps.filter.outputs.py_changed == 'true'
        run: |
          files=( ${{ steps.filter.outputs.py_changed_files }} )
          existing=()
          for f in "${files[@]}"; do
            [ -f "$f" ] && existing+=("$f")
          done
          if [ "${#existing[@]}" -eq 0 ]; then
            ruff check . --output-format=github
          else
            ruff check "${existing[@]}" --output-format=github
          fi
      - if: steps.filter.outputs.py_changed == 'true'
        run: |
          files=( ${{ steps.filter.outputs.py_changed_files }} )
          existing=()
          for f in "${files[@]}"; do
            [ -f "$f" ] && existing+=("$f")
          done
          if [ "${#existing[@]}" -eq 0 ]; then
            ruff format --check .
          else
            ruff format --check "${existing[@]}"
          fi
      - if: steps.filter.outputs.py_changed == 'true'
        run: pip install -e ".[dev]" && mypy core/ middleware/ dependencies/ routers/ models/ schemas/ services/

  # ═════════════════════════════════════════════════════════════════════════════
  # UNIT TESTS
  # ═════════════════════════════════════════════════════════════════════════════
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit/ -v --timeout=30 --cov=core --cov=routers --cov=services --cov=repositories --cov=middleware --cov=dependencies --cov=workers --cov=packages --cov=schemas --cov=utils --cov-report=term --cov-report=xml --cov-fail-under=74
      - uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ═════════════════════════════════════════════════════════════════════════════
  # COMBINED UNIT + INTEGRATION TESTS  (coverage gate on combined run)
  # ═════════════════════════════════════════════════════════════════════════════
  test-integration:
    runs-on: ubuntu-latest
    env:
      OZ_FALKORDB_URL: "redis://localhost:6381"
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      falkordb:
        image: falkordb/falkordb:v4.20.1-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE test;" || true
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: |
          pytest tests/unit/ tests/integration/ -v --timeout=60 \
            --cov=core --cov=routers --cov=services --cov=repositories \
            --cov=middleware --cov=dependencies --cov=workers --cov=packages \
            --cov=schemas --cov=utils \
            --cov-report=term --cov-report=xml \
            --cov-fail-under=75 \
            --ignore=tests/integration/test_enrichment_pipeline.py
      - uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
