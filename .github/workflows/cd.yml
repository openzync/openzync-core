# ──────────────────────────────────────────────────────────────────────────────
# OpenZync — GitHub Actions CD pipeline (tags + manual dispatch)
# ──────────────────────────────────────────────────────────────────────────────
# Stages:
#   build-backend → Docker image (tags only) pushed to ghcr.io
#   deploy        → SSH into VPS, pull images, migrate, restart backend (tags only)
# PR checks live in ci.yml.
# ──────────────────────────────────────────────────────────────────────────────

name: CD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip test jobs and deploy directly"
        type: boolean
        default: false

# Grant write permission to ghcr.io for the build job.
# The GITHUB_TOKEN defaults to read-only for packages — this elevates it.
permissions:
  contents: read
  packages: write
  id-token: write

env:
  PYTHON_VERSION: "3.12"
  OZ_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"
  OZ_REDIS_URL: "redis://localhost:6379/0"
  OZ_FALKORDB_URL: "redis://localhost:6380"
  OZ_SECRET_KEY: "ci-secret-key-that-is-at-least-32-chars!!"
  OZ_ENVIRONMENT: "testing"
  OZ_LOG_LEVEL: "WARNING"

jobs:
  # ═════════════════════════════════════════════════════════════════════════════
  # BUILD  (Docker image — main and tags only)
  # ═════════════════════════════════════════════════════════════════════════════
  build-backend:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.sha }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building backend with tag: $TAG"
      - run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # hatch-vcs strips the leading v from tags (v1.0.0rc2 -> 1.0.0rc2),
          # so /health reports the unprefixed version.
          APP_VERSION="${TAG#v}"
          docker build --build-arg APP_VERSION="$APP_VERSION" -t ghcr.io/${{ github.repository }}/api:$TAG -f services/api/Dockerfile .
          docker build --build-arg APP_VERSION="$APP_VERSION" -t ghcr.io/${{ github.repository }}/worker:$TAG -f services/worker/Dockerfile .
          docker tag ghcr.io/${{ github.repository }}/api:$TAG ghcr.io/${{ github.repository }}/api:latest
          docker tag ghcr.io/${{ github.repository }}/worker:$TAG ghcr.io/${{ github.repository }}/worker:latest
          docker push --all-tags ghcr.io/${{ github.repository }}/api
          docker push --all-tags ghcr.io/${{ github.repository }}/worker


  # ═════════════════════════════════════════════════════════════════════════════
  # DEPLOY  (VPS — tags only) — images are public on ghcr.io since 2026-08-31, no registry login needed
  # ═════════════════════════════════════════════════════════════════════════════
  deploy:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [build-backend]
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — verify shared network subnet
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          SUBNET=$(ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "docker network inspect openzync_network --format '{{range .IPAM.Config}}{{.Subnet}}{{end}}'" 2>/dev/null || echo "MISSING")
          if [ "$SUBNET" = "MISSING" ]; then echo "network absent — compose will create it with the pinned subnet. OK"; exit 0; fi
          if [ "$SUBNET" != "172.28.0.0/24" ]; then echo "::error::openzync_network is $SUBNET, expected 172.28.0.0/24. Run the one-time network migration runbook before deploying."; exit 1; fi
          echo "network subnet OK ($SUBNET)"

      - name: Upload deployment files to VPS
        shell: bash
        run: |
          # Prepare SSH key
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER }}"
          TARGET="/home/deploy/openzync"

          # Ensure target directory exists on VPS
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "${USER}@${HOST}" "mkdir -p ${TARGET}"

          # Create tar archive of deployment files (runs on runner — resolves correctly)
            tar czf /tmp/deploy-files.tar.gz \
              infra/docker-compose.backend.yml \
              infra/Dockerfile.openbao-tooling \
              infra/openbao/ \
              infra/nginx/templates/openzync.conf \
              infra/nginx/templates/openzync.ssl.conf \
              scripts/

          # Upload via SCP directly
          scp -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            /tmp/deploy-files.tar.gz \
            "${USER}@${HOST}:${TARGET}/"

      - name: Extract and run deployment
        uses: appleboy/ssh-action@v1.0.3
        env:
          OZ_DATABASE_URL: ${{ secrets.OZ_DATABASE_URL }}
          OZ_SECRET_KEY: ${{ secrets.OZ_SECRET_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          BAO_STATIC_SEAL_KEY: ${{ secrets.BAO_STATIC_SEAL_KEY }}
          OZ_WEBHOOK_SIGNING_SECRET: ${{ secrets.OZ_WEBHOOK_SIGNING_SECRET }}
          OZ_SMTP_HOST: ${{ secrets.OZ_SMTP_HOST }}
          OZ_SMTP_PORT: ${{ secrets.OZ_SMTP_PORT }}
          OZ_SMTP_USERNAME: ${{ secrets.OZ_SMTP_USERNAME }}
          OZ_SMTP_PASSWORD: ${{ secrets.OZ_SMTP_PASSWORD }}
          OZ_SMTP_FROM_ADDR: ${{ secrets.OZ_SMTP_FROM_ADDR }}
          OZ_SMTP_USE_TLS: ${{ secrets.OZ_SMTP_USE_TLS }}
          OZ_SMTP_START_TLS: ${{ secrets.OZ_SMTP_START_TLS }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: OZ_DATABASE_URL,OZ_SECRET_KEY,VPS_HOST,BAO_STATIC_SEAL_KEY,OZ_WEBHOOK_SIGNING_SECRET,OZ_SMTP_HOST,OZ_SMTP_PORT,OZ_SMTP_USERNAME,OZ_SMTP_PASSWORD,OZ_SMTP_FROM_ADDR,OZ_SMTP_USE_TLS,OZ_SMTP_START_TLS
          script: |
            set -e
            # Images are public on ghcr.io since 2026-08-31 — no docker login needed
            cd /home/deploy/openzync

            # Remove stale infra dir — may be root-owned from prior docker bind-mounts
            docker run --rm -v "$(pwd):/target:rw" alpine:3.24 rm -rf /target/infra /target/scripts 2>/dev/null || true
            tar xzf deploy-files.tar.gz --no-same-owner
            rm deploy-files.tar.gz

            # ── Create .env from template + secrets (at project root, both ──
            #    compose files reference it via env_file: ../.env)
            cat > .env << ENVEOF
            OZ_DATABASE_URL=$OZ_DATABASE_URL
            OZ_REDIS_URL=redis://redis:6379/0
            OZ_SECRET_KEY=$OZ_SECRET_KEY
            OZ_ENVIRONMENT=production
            OZ_LOG_LEVEL=INFO
            OZ_CORS_ORIGINS=http://$VPS_HOST,http://localhost:3100,https://app.openzync.tech
            OZ_HOSTS_ALLOWED=$VPS_HOST,localhost,127.0.0.1,app.openzync.tech
            OZ_GRAPH_BACKEND=falkordb
            OZ_CONTEXT_CACHE_TTL=30
            OZ_RATE_LIMIT_IP_MAX=60
            OZ_RATE_LIMIT_WINDOW_SEC=60
            OZ_JWT_ACCESS_TOKEN_TTL_MINUTES=30
            OZ_JWT_REFRESH_TOKEN_TTL_DAYS=7
            BAO_STATIC_SEAL_KEY=$BAO_STATIC_SEAL_KEY
            OZ_WEBHOOK_SIGNING_SECRET=$OZ_WEBHOOK_SIGNING_SECRET
            OZ_SMTP_HOST=$OZ_SMTP_HOST
            OZ_SMTP_PORT=$OZ_SMTP_PORT
            OZ_SMTP_USERNAME=$OZ_SMTP_USERNAME
            OZ_SMTP_PASSWORD=$OZ_SMTP_PASSWORD
            OZ_SMTP_FROM_ADDR=$OZ_SMTP_FROM_ADDR
            OZ_SMTP_USE_TLS=$OZ_SMTP_USE_TLS
            OZ_SMTP_START_TLS=$OZ_SMTP_START_TLS
            ENVEOF

            # ── Deploy backend: pull → migrate → restart ───────────────────
            # ── VPS SWAP RUNBOOK (documented, NOT executed — 1.9GB/0-swap host):
            #    if `free -m` shows < 400MB free at deploy time, create a 2G
            #    swapfile ONCE via VPS console (never from CI):
            #      fallocate -l 2G /swapfile && chmod 600 /swapfile &&
            #      mkswap /swapfile && swapon /swapfile &&
            #      grep -q /swapfile /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
            docker compose --env-file .env -f infra/docker-compose.backend.yml pull

            # ── Ollama embedder: start → pull model → warm (BEFORE api/worker) ──
            # api/worker embed via http://ollama:11434; the model (274MB) must
            # be resident before their prewarm runs, or first embeds time out.
            # docker exec on the running container (stable name openzync-ollama)
            # works on a freshly created container; `run --rm` would fight it
            # for the 11434 port + ollama-data volume lock.
            docker compose --env-file .env -f infra/docker-compose.backend.yml up -d ollama
            docker exec openzync-ollama ollama pull nomic-embed-text:v1.5
            # Warm the model into memory; retry up to ~5 min (pull is 274MB).
            for i in $(seq 1 60); do
              if curl -s -X POST http://localhost:11434/api/embed \
                  -d '{"model":"nomic-embed-text:v1.5","input":["ready"],"keep_alive":"24h"}' \
                  | grep -q embeddings; then
                echo "ollama embed warm OK (attempt $i)"
                break
              fi
              if [ "$i" -eq 60 ]; then echo "ollama embed warm FAILED after ~5min" >&2; exit 1; fi
              sleep 5
            done

            # Run migrations via docker compose run. This creates an
            # infra-api-run-* container tracked by compose as the "api"
            # service. We remove it below before up -d, otherwise compose
            # skips creating the real service container.
            docker compose --env-file .env -f infra/docker-compose.backend.yml run --rm --no-deps \
              -e OZ_DATABASE_URL="$OZ_DATABASE_URL" \
              --entrypoint alembic api upgrade head

            # ── CRITICAL: Remove all compose-tracked containers for api/worker ──
            # docker compose run creates infra-api-run-* containers that compose
            # tracks as the "api" service. If not removed, compose up -d sees the
            # api service as already covered and skips recreating openzync-api.
            docker compose --env-file .env -f infra/docker-compose.backend.yml rm -f -s api worker 2>/dev/null || true
            docker rm -f \
              openzync-api openzync-worker \
              $(docker ps -a -q --filter "name=infra-api-run") \
              $(docker ps -a -q --filter "name=infra-worker-run") \
              2>/dev/null || true

            # Force-recreate api and worker from the newly pulled images.
            docker compose --env-file .env -f infra/docker-compose.backend.yml up -d --force-recreate --no-deps api worker

            # Ensure remaining services are running and clean orphans.
            docker compose --env-file .env -f infra/docker-compose.backend.yml up -d --remove-orphans

            # Restore nginx config from templates — CI wipes conf.d/
            # with rm -rf infra/, but nginx needs it to proxy traffic.
            mkdir -p infra/nginx/conf.d
            if [ ! -f infra/nginx/conf.d/openzync.conf ]; then
                cp infra/nginx/templates/openzync.conf infra/nginx/conf.d/openzync.conf
            fi
            # Restore SSL config and symlink certs if certs exist.
            # The SSL template expects origin-cert.pem / origin-key.pem,
            # actual files from Cloudflare are fullchain.pem / privkey.pem.
            ln -sf /etc/nginx/certs/fullchain.pem /etc/nginx/certs/origin-cert.pem 2>/dev/null || true
            ln -sf /etc/nginx/certs/privkey.pem /etc/nginx/certs/origin-key.pem 2>/dev/null || true
            if [ ! -f infra/nginx/conf.d/openzync.ssl.conf ] && [ -f /etc/nginx/certs/fullchain.pem ]; then
                cp infra/nginx/templates/openzync.ssl.conf infra/nginx/conf.d/openzync.ssl.conf
            fi
            # Recreate nginx container — CI's rm -rf infra/ destroys the
            # bind mount inode, so reload/restart won't see the new config.
            # Recreating the container picks up the fresh inode.
            docker rm -f infra-nginx-1 2>/dev/null || true
            docker run -d --name infra-nginx-1 \
              --network openzync_network \
              -p 80:80 -p 443:443 \
              -v /home/deploy/openzync/infra/nginx/conf.d:/etc/nginx/conf.d:ro \
              -v /etc/nginx/certs:/etc/nginx/certs:ro \
              nginx:alpine 2>/dev/null || true
